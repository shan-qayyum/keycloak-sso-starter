# Optional override: store Keycloak data in Postgres instead of the
# in-container H2 database, so users/sessions/config survive `docker compose down`.
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#
# Remove the data with:  docker compose -f docker-compose.yml -f docker-compose.postgres.yml down -v

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycloak-dev-only}
    volumes:
      # Postgres 18+ images expect the volume at /var/lib/postgresql (not .../data).
      - keycloak-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No published port: only Keycloak needs to reach it.

  keycloak:
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-keycloak-dev-only}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  keycloak-db:
